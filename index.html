<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPulse Engine - Autonomous AI Security Recon</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex flex-col justify-between items-center p-4 sm:p-8">

    <!-- Header Section -->
    <header class="text-center my-8">
        <h1 class="text-3xl sm:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-3">
            Autonomous AI Security Recon & Audit
        </h1>
        <p class="text-gray-400 text-sm sm:text-base max-w-xl mx-auto">
            የድርጅትዎን ወይም የኔትወርክዎን ደህንነት ሲስተሞች በ AI እና አውቶሜሽን አፕሊኬሽን ስካን ያድርጉ።
        </p>
    </header>

    <!-- Main Card -->
    <main class="w-full max-w-lg glass-card rounded-2xl p-6 sm:p-8 shadow-2xl">
        <h2 class="text-xl font-bold text-cyan-400 text-center mb-6">Request AI Security Audit</h2>

        <form id="auditForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1" for="email">
                    Email Address (ሪፖርቱ የሚላክበት ኢሜይል)
                </label>
                <input 
                    type="email" 
                    id="email" 
                    required 
                    placeholder="example@gmail.com"
                    class="w-full px-4 py-3 rounded-lg bg-slate-900/80 border border-slate-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition duration-200"
                />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1" for="target">
                    Target IP / Domain (ሚፈተሸው IP)
                </label>
                <input 
                    type="text" 
                    id="target" 
                    required 
                    placeholder="196.188.184.9"
                    class="w-full px-4 py-3 rounded-lg bg-slate-900/80 border border-slate-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition duration-200"
                />
            </div>

            <button 
                type="submit" 
                id="submitBtn"
                class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 font-bold rounded-lg shadow-lg hover:shadow-cyan-500/20 transition duration-300 flex items-center justify-center space-x-2">
                <span id="btnText">Start Security Scan</span>
                <span id="btnSpinner" class="hidden">
                    <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </span>
            </button>
        </form>

        <!-- Result Status Area -->
        <div id="result" class="mt-6 text-center text-sm hidden"></div>
    </main>

    <!-- Footer -->
    <footer class="mt-12 text-center text-gray-500 text-xs">
        &copy; 2026 CyberPulse Engine. All rights reserved.
    </footer>

    <!-- Frontend Script -->
    <script>
        const form = document.getElementById('auditForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const resultDiv = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const target = document.getElementById('target').value.trim();

            // UI Loading state
            submitBtn.disabled = true;
            btnText.textContent = "Scanning...";
            btnSpinner.classList.remove('hidden');
            resultDiv.classList.add('hidden');
            resultDiv.className = "mt-6 text-center text-sm p-4 rounded-lg";

            try {
                // Backend API Call (/scan endpoint)
                const response = await fetch('/scan', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, target })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.classList.remove('hidden');
                    resultDiv.classList.add('bg-slate-900/90', 'border', 'border-cyan-500/50', 'text-gray-200');
                    
                    // Corrected URL redirection for audit report
                    resultDiv.innerHTML = `
                        <p class="mb-2"><span class="inline-block w-3 h-3 bg-green-500 rounded-full mr-2"></span>Scan initiated successfully for target: <strong class="text-white">${target}</strong></p>
                        <a href="/audit_report.html" target="_blank" class="text-cyan-400 underline font-semibold hover:text-cyan-300">
                            [ View Executive Report ]
                        </a>
                    `;
                } else {
                    throw new Error(data.detail || data.error || "Failed to start scan");
                }
            } catch (err) {
                resultDiv.classList.remove('hidden');
                resultDiv.classList.add('bg-red-900/50', 'border', 'border-red-500', 'text-red-300');
                resultDiv.innerHTML = `⚠️ <strong>Error:</strong> ${err.message}`;
            } finally {
                // Reset Button UI
                submitBtn.disabled = false;
                btnText.textContent = "Start Security Scan";
                btnSpinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
